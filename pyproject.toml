[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toranime-mpv"
version = "2.2.17"
description = "Stream anime in mpv through TorBox, English dubs included - interactive picker, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vashistha Pandya" }]
keywords = ["anime", "dub", "mpv", "cli", "streaming"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []  # stdlib only, by design

[project.urls]
Homepage = "https://github.com/throwin5s/toranime"
Issues = "https://github.com/throwin5s/toranime/issues"

[project.scripts]
toranime = "toranime:main"

[tool.setuptools]
py-modules = ["toranime"]

[tool.ruff]
target-version = "py38"
line-length = 110

[tool.ruff.lint]
# pyflakes, pycodestyle errors, bugbear. E401: `import termios, tty, select` is the
# onepace house style for the optional POSIX imports
select = ["E", "F", "B", "W"]
ignore = ["E401"]
